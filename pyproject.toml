[project]
name = "pick-place-challenge"
version = "0.1.0"
description = "Open-ended Franka + Robotiq pick-and-place sandbox on mjlab (Index Robotics)."
readme = "README.md"
authors = [
    { name = "Ben Eisner", email = "ben@indexrobots.ai" }
]
requires-python = ">=3.13"
dependencies = [
    "imageio[ffmpeg]>=2.37.0",
    "mjlab>=1.4.0",
    "mujoco>=3.8.1",
    "numpy>=2.4.6",
    "objaverse>=0.1.7",
    "pillow>=12.2.0",
    "pyarrow>=18.0.0",
    "robot-descriptions>=2.0.0",
    "torch>=2.12.0",
    "tqdm>=4.67.0",
    "trimesh>=4.12.2",
    "tyro>=1.0.13",
]

# Register our task package with mjlab's plugin hook. On `import mjlab`,
# mjlab auto-imports every package under this entry-point group (see
# mjlab/__init__.py:_import_registered_packages), so our envs are registered
# whenever mjlab's stock `play`/`train` run — no need to shadow them.
[project.entry-points."mjlab.tasks"]
pick_place_challenge = "pick_place_challenge.task"

[project.optional-dependencies]
# GPU JPEG/video decode for the dataloading benchmark's `dali` backend. Optional
# (GPU-only); install with:  uv sync --extra dali  (pick the wheel matching your
# CUDA — cuda130 here; swap to nvidia-dali-cuda120 + its index for CUDA 12).
dali = ["nvidia-dali-cuda130>=2.1.1"]

[project.scripts]
pick-place-envs = "pick_place_challenge.cli:list_envs"
pick-place-fetch-assets = "pick_place_challenge.scene:fetch_all_assets"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "prek>=0.4.4",
    "pybind11-stubgen>=2.5.5",
    "pytest>=8",
    "ruff>=0.6",
    "ty>=0.0.44",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

# DALI ships from NVIDIA's flat wheel index, not PyPI. `explicit = true` keeps it
# scoped to the package below, so normal resolution is unaffected.
[[tool.uv.index]]
name = "nvidia-dali"
url = "https://developer.download.nvidia.com/compute/redist/nvidia-dali-cuda130/"
format = "flat"
explicit = true

[tool.uv.sources]
nvidia-dali-cuda130 = { index = "nvidia-dali" }

[tool.ruff]
extend-exclude = [".typings"]  # generated mujoco stubs

[tool.deptry]
known_first_party = ["pick_place_challenge"]

[tool.deptry.per_rule_ignores]
# warp / mujoco_warp are mjlab's GPU backend; the OSC controller uses them directly.
DEP003 = ["warp", "mujoco_warp"]
# compare.py imports the sibling eval_policy script (added to sys.path at runtime).
DEP001 = ["eval_policy"]

[tool.ty.environment]
# mujoco is a pybind11 extension with no shipped stubs; generate them with
#   uv run pybind11-stubgen --ignore-all-errors mujoco -o .typings
extra-paths = [".typings"]

[tool.ty.src]
include = ["src", "scripts", "tests"]
exclude = [".typings"]

# scene.py is all MuJoCo/trimesh glue; their pybind/3rd-party stubs mistype
# array-like property setters and load() unions, so silence those false
# positives here (real type checking stays on everywhere else).
[[tool.ty.overrides]]
include = ["src/pick_place_challenge/scene.py"]
[tool.ty.overrides.rules]
invalid-assignment = "ignore"
call-non-callable = "ignore"
no-matching-overload = "ignore"
unresolved-attribute = "ignore"

# mjlab types step() obs values as Tensor, but our camera group is a dict; and
# mujoco.viewer is a submodule the generated stubs don't cover.
[[tool.ty.overrides]]
include = ["scripts/**", "tests/**"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-import = "ignore"
unresolved-attribute = "ignore"
